            justify-content: center;
        }

            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-submit {
            background: #667eea;
            color: white;
        }

            background: #5568d3;

        }
        
        .btn-reset {
            background: #f59e0b;
            color: white;
        }
        
        .btn-reset:hover {
            background: #d97706;
            transform: translateY(-2px);

            color: white;
        }

            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #ddd;
            position: relative;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        }

            border-radius: 8px;

        }

        }

            font-size: 0.95em;
        }

            margin-bottom: 15px;
            color: #1f2937;
            font-weight: 500;
        }

            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .option:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }
        
        .option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .option input[type="radio"]:checked + label {
            color: #667eea;
            font-weight: 600;
        }
        
        .option label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }
        
        .correct-answer {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
        }
        
        .correct-answer::after {
            content: "✓ CORRECT";
            color: #10b981;
            font-weight: bold;
            margin-left: 10px;
            font-size: 0.9em;
        }
        
        .wrong-answer {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
        
        .wrong-answer::after {
            content: "✗ INCORRECT";
            color: #ef4444;
            font-weight: bold;
            margin-left: 10px;
            font-size: 0.9em;
        }
        
        .user-selected {
            border-color: #667eea !important;
            background: #ede9fe !important;
        }

            display: none;
            padding: 30px;
            text-align: center;
            background: #f0f9ff;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .results.show {
            display: block;
        }

            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-size: 3em;
            font-weight: bold;
            color: white;
        }

            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        
        .score-circle.pass {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

            color: #1f2937;

        let answers = {};
        let showingAnswers = false;

        function generateExam() {
            const form = document.getElementById('examForm');
            form.innerHTML = '';
            
            examData.forEach(q => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.id = `q${q.num}`;
                
                let optionsHTML = '';
                q.options.forEach((option, index) => {
                    const optionId = `q${q.num}_opt${index}`;
                    optionsHTML += `
                        <div class="option">
                            <input type="radio" id="${optionId}" name="q${q.num}" value="${index}">
                            <label for="${optionId}">${String.fromCharCode(65 + index)}) ${option}</label>
                        </div>
                    `;
                });
                
                questionDiv.innerHTML = `
                    <div class="question-number">Question ${q.num} - ${q.category}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${optionsHTML}</div>
                `;
                
                form.appendChild(questionDiv);
                
                // Add event listeners to track answers
                q.options.forEach((_, index) => {
                    const input = document.getElementById(`q${q.num}_opt${index}`);
                    input.addEventListener('change', () => {
                        answers[q.num] = index;
                        updateProgress();
                    });
                });
            });
        }

        function updateProgress() {
            const answered = Object.keys(answers).length;
            const total = examData.length;
            const percentage = (answered / total) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        function submitExam() {
            const answered = Object.keys(answers).length;
            const total = examData.length;
            
            if (answered === 0) {
                alert('Please answer at least one question.');
                return;
            }
            
            let correct = 0;
            let categoryScores = {};
            
            examData.forEach(q => {
                const userAnswer = answers[q.num];
                if (userAnswer !== undefined && userAnswer === q.correct) {
                    correct++;
                }
                
                if (!categoryScores[q.category]) {
                    categoryScores[q.category] = { correct: 0, total: 0 };
                }
                categoryScores[q.category].total++;
                if (userAnswer !== undefined && userAnswer === q.correct) {
                    categoryScores[q.category].correct++;
                }
            });
            
            const percentage = (correct / total) * 100;
            let scoreClass = 'excellent';
            let message = '🎉 Excellent!';
            
            if (percentage < 60) {
                scoreClass = 'fail';
                message = '❌ Needs Improvement';
            } else if (percentage < 70) {
                scoreClass = 'pass';
                message = '✓ Pass';
            } else if (percentage < 85) {
                scoreClass = 'good';
                message = '😊 Good Job!';
            }
            
            let categoryHTML = '';
            Object.keys(categoryScores).sort().forEach(category => {
                const scores = categoryScores[category];
                const categoryPercent = (scores.correct / scores.total * 100).toFixed(1);
                categoryHTML += `
                    <div class="category-section">
                        <div class="category-title">${category}</div>
                        <div class="category-stat">${scores.correct}/${scores.total} correct (${categoryPercent}%)</div>
                    </div>
                `;
            });
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <h2>${message}</h2>
                <div class="score-circle ${scoreClass}">${percentage.toFixed(1)}%</div>
                <p><strong>Score: ${correct} out of ${total} questions</strong></p>
                <p>You answered ${answered} out of ${total} questions</p>
                <div style="margin-top: 20px; text-align: left;">${categoryHTML}</div>
            `;
            resultsDiv.classList.add('show');
            
            highlightAnswers();
        }

        function showAnswers() {
            showingAnswers = !showingAnswers;
            highlightAnswers();
            
            const btn = document.querySelector('.btn-show-answers');
            btn.textContent = showingAnswers ? 'Hide Correct Answers' : 'Show Correct Answers';
        }

        function highlightAnswers() {
            examData.forEach(q => {
                const questionDiv = document.getElementById(`q${q.num}`);
                
                // Remove previous highlighting
                questionDiv.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('correct-answer', 'wrong-answer', 'user-selected');
                });
                
                q.options.forEach((_, index) => {
                    const option = questionDiv.querySelector(`[value="${index}"]`);
                    const optionDiv = option.closest('.option');
                    
                    if (showingAnswers || Object.keys(answers).length === examData.length) {
                        if (index === q.correct) {
                            optionDiv.classList.add('correct-answer');
                        } else if (answers[q.num] === index) {
                            optionDiv.classList.add('wrong-answer');
                        }
                    }
                    
                    if (answers[q.num] === index) {
                        optionDiv.classList.add('user-selected');
                    }
                });
            });
        }

        function resetExam() {
            if (confirm('Are you sure you want to reset the exam?')) {
                answers = {};
                showingAnswers = false;
                document.getElementById('results').classList.remove('show');
                document.getElementById('progressBar').style.width = '0%';
                document.querySelector('.btn-show-answers').textContent = 'Show Correct Answers';
                generateExam();
            }
        }

        // Initialize exam on page load
        generateExam();
    </script>
